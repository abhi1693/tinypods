[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinypods-worker"
# Generated from VERSION by scripts/sync_version.py.
version = "0.0.1"
requires-python = ">=3.13"
dependencies = ["tinypods-core"]

[tool.setuptools]
packages = ["tinypods_worker"]

[tool.setuptools.package-dir]
tinypods_worker = "src"

[tool.setuptools.package-data]
tinypods_worker = ["py.typed"]

[project.scripts]
tinypods-worker = "tinypods_worker:run_worker"

[tool.uv.sources]
tinypods-core = { workspace = true }
