[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinypods-api"
# Generated from VERSION by scripts/sync_version.py.
version = "0.0.1"
requires-python = ">=3.13"
dependencies = ["tinypods-core", "fastapi>=0.162.0", "uvicorn>=0.34", "typer>=0.27.3"]

[tool.setuptools]
packages = ["tinypods_api", "tinypods_api.cache", "tinypods_api.http"]

[tool.setuptools.package-dir]
tinypods_api = "src"

[tool.setuptools.package-data]
tinypods_api = ["py.typed"]

[project.scripts]
tinypods-api = "tinypods_api:run_api"
tinypods-openapi = "tinypods_api.http.schema:cli"

[tool.uv.sources]
tinypods-core = { workspace = true }
