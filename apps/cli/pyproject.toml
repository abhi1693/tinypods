[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinypods-cli"
# Generated from VERSION by scripts/sync_version.py.
version = "0.0.1"
requires-python = ">=3.13"
dependencies = ["tinypods-core", "typer>=0.15"]

[tool.setuptools]
packages = ["tinypods_cli"]

[tool.setuptools.package-dir]
tinypods_cli = "src"

[tool.setuptools.package-data]
tinypods_cli = ["py.typed"]

[project.scripts]
tinypods = "tinypods_cli.main:main"

[tool.uv.sources]
tinypods-core = { workspace = true }
