name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    uses: abhi1693/actions/.github/workflows/python-ci.yml@4bc25a3100cbfbece517ddad161d59d13c029675
    with:
      python-version: '3.13'
      uv-version: '0.12.21'
      sync-command: uv sync --locked --all-packages --no-editable
      lint-command: uv run --no-sync python scripts/sync_version.py --check && uv run --no-sync ruff check . && uv run --no-sync ruff format --check . && uv run --no-sync mypy
      test-command: uv run --no-sync tinypods-openapi --check && uv run --no-sync openapi-spec-validator openapi.json && uv run --no-sync pytest
      test-results-path: reports/
      test-results-name: backend-tests-${{ github.run_attempt }}

  coverage-report:
    name: Backend coverage report
    needs: python
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Reports are data. Never check out or execute PR code in this job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: backend-tests-${{ github.run_attempt }}
          path: report
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BACKEND_RESULT: ${{ needs.python.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tinypods-backend-coverage -->';
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (current.data.head.sha !== pr.head.sha) return;
            const workspaces = {
              core: 'packages/core', api: 'apps/api', cli: 'apps/cli', worker: 'apps/worker'
            };
            const counters = ['covered_lines', 'num_statements', 'covered_branches', 'num_branches'];
            const empty = () => Object.fromEntries(counters.map(key => [key, 0]));
            const integer = value => Number.isSafeInteger(value) && value >= 0 && value <= 10000000;
            const validCounts = value => value && counters.every(key => integer(value[key])) &&
              value.covered_lines <= value.num_statements && value.covered_branches <= value.num_branches;
            const percent = (covered, total) => total ? (100 * covered / total).toFixed(2) : '100.00';
            const row = (name, value) => `| ${name} | ${value.covered_lines}/${value.num_statements} (${percent(value.covered_lines, value.num_statements)}%) | ${value.covered_branches}/${value.num_branches} (${percent(value.covered_branches, value.num_branches)}%) | ${percent(value.covered_lines + value.covered_branches, value.num_statements + value.num_branches)}% |`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sourceUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${pr.head.sha}/`;
            const lines = [marker, '### Backend coverage', ''];
            let valid = false;
            try {
              if (fs.statSync('report/coverage.json').size > 2000000) throw new Error('Report too large');
              const report = JSON.parse(fs.readFileSync('report/coverage.json', 'utf8'));
              const files = Object.entries(report.files || {});
              if (report.meta?.branch_coverage !== true || !validCounts(report.totals) ||
                  !report.totals.num_statements || !files.length || files.length > 200) {
                throw new Error('Invalid coverage report');
              }
              const sums = empty();
              const packages = Object.fromEntries(Object.values(workspaces).map(name => [name, empty()]));
              const measured = new Set();
              const missing = [];
              for (const [filename, file] of files) {
                const match = /(?:^|\/)tinypods_(core|api|cli|worker)\/([A-Za-z0-9_\/]+\.py)$/.exec(filename);
                if (!match || !validCounts(file.summary)) throw new Error('Unknown source file');
                const workspace = workspaces[match[1]];
                const source = `${workspace}/src/${match[2]}`;
                if (measured.has(source)) throw new Error('Duplicate source file');
                measured.add(source);
                for (const key of counters) {
                  sums[key] += file.summary[key];
                  packages[workspace][key] += file.summary[key];
                }
                for (const key of ['executed_lines', 'missing_lines']) {
                  if (!Array.isArray(file[key]) || file[key].length > 20000 ||
                      !file[key].every(value => integer(value) && value > 0) ||
                      new Set(file[key]).size !== file[key].length) throw new Error('Invalid lines');
                }
                const covered = new Set(file.executed_lines);
                if (file.missing_lines.some(line => covered.has(line)) ||
                    file.executed_lines.length !== file.summary.covered_lines ||
                    file.executed_lines.length + file.missing_lines.length !== file.summary.num_statements) {
                  throw new Error('Inconsistent lines');
                }
                for (const key of ['executed_branches', 'missing_branches']) {
                  if (!Array.isArray(file[key]) || file[key].length > 20000 || !file[key].every(arc =>
                    Array.isArray(arc) && arc.length === 2 && integer(arc[0]) && arc[0] > 0 &&
                    Number.isSafeInteger(arc[1]) && Math.abs(arc[1]) <= 10000000)) throw new Error('Invalid branches');
                }
                const arcs = [...file.executed_branches, ...file.missing_branches].map(arc => arc.join(':'));
                if (new Set(arcs).size !== arcs.length ||
                    file.executed_branches.length !== file.summary.covered_branches ||
                    arcs.length !== file.summary.num_branches) throw new Error('Inconsistent branches');
                if (file.missing_lines.length || file.missing_branches.length) {
                  const target = file.missing_lines[0] || file.missing_branches[0][0];
                  const list = values => values.slice(0, 20).join(', ') + (values.length > 20 ? ', …' : '');
                  missing.push(`| [${source}](${sourceUrl}${source}#L${target}) | ${list(file.missing_lines) || '—'} | ${list(file.missing_branches.map(([from, to]) => `${from}→${to < 0 ? 'exit' : to}`)) || '—'} |`);
                }
              }
              if (!counters.every(key => sums[key] === report.totals[key]) ||
                  Object.values(packages).some(value => !value.num_statements)) throw new Error('Incomplete totals');
              lines.push(`**${process.env.BACKEND_RESULT === 'success' ? 'PASS' : 'FAIL'}** · backend CI.`, '',
                '| Workspace | Statements covered | Branches covered | Combined |', '| --- | ---: | ---: | ---: |',
                row('All backend code', sums));
              for (const [name, value] of Object.entries(packages)) lines.push(row(name, value));
              lines.push('', '### Uncovered code', '');
              if (missing.length) {
                lines.push('| Source | Missing statements | Missing branch arcs |', '| --- | --- | --- |', ...missing.slice(0, 50));
              } else lines.push('No uncovered statements or branches in the measured backend code.');
              lines.push('', 'Includes API, core, CLI and worker code exercised by unit and real-service tests. Each file lists up to 20 missing statements/arcs; HTML has the complete detail. `exit` means a branch leaving its function. These are whole-backend metrics, not changed-line coverage.');
              valid = true;
            } catch {
              lines.push('**Coverage unavailable:** the current attempt has no valid complete report. This is not a passing coverage check. Rerun the backend job and report job together.');
            }
            lines.push('', `Commit: ${pr.head.sha.slice(0, 12)} · [HTML, JSON, XML, JUnit and job logs](${runUrl}) · attempt ${process.env.GITHUB_RUN_ATTEMPT}`);
            const body = lines.join('\n');
            if (body.length > 60000) throw new Error('Comment too large');
            await core.summary.addRaw(body).write();
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: pr.number});
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body?.startsWith(marker));
            const latest = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (latest.data.head.sha !== pr.head.sha) return;
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
            }
            if (!valid) core.setFailed('Backend coverage artifact is missing or invalid');
