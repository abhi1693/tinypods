[project]
name = "tinypods-workspace"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "apps/cli", "packages/core"]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --cov=tinypods_core --cov=tinypods_api --cov=tinypods_worker --cov=tinypods_cli --cov-branch --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml --cov-fail-under=90"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages/core/src", "apps/api/src", "apps/worker/src", "apps/cli/src"]
explicit_package_bases = true

[tool.coverage.run]
patch = ["subprocess"]
